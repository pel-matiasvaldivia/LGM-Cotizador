services:
  app:
    image: ghcr.io/pel-matiasvaldivia/lgm-cotizador:master
    container_name: logmetal_app
    restart: unless-stopped
    ports:
      - "3300:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      # Credenciales como variables separadas: soporta contraseñas con
      # caracteres especiales (@, /, #, :) que romperían una DATABASE_URL.
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=lgm
      - PGPASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      - PGDATABASE=cotizador
      # Servís por HTTP: la cookie de sesión NO debe ser Secure (si no, el
      # navegador la descarta y no persiste el login). Poner true al usar HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Multi-tenant: la identidad de cada empresa vive en la base y se resuelve
      # por dominio. BRAND sólo aporta los valores iniciales del primer arranque
      # (config/brands/<BRAND>.json); el resto de los BRAND_* viajan en .env.
      - BRAND=${BRAND:-logmetal}
    volumes:
      # Logos e imágenes del tenant sin rebuildear la imagen: dejá los archivos
      # en ./brand y referencialos como /brand/mi-logo.svg en la config.
      - ./brand:/app/public/brand:ro
      # Config de marca completa fuera del repo (opcional): descomentar y
      # además definir BRAND_CONFIG_FILE=/app/config/tenant/marca.json en .env.
      # - ./marca.json:/app/config/tenant/marca.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: logmetal_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=lgm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      - POSTGRES_DB=cotizador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgm -d cotizador"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Backup diario de la base a ./backups (rotación: 14 días)
  backup:
    image: postgres:16-alpine
    container_name: logmetal_backup
    restart: unless-stopped
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U lgm cotizador | gzip > /backups/cotizador_$$(date +%Y%m%d_%H%M).sql.gz &&
        find /backups -name "*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
