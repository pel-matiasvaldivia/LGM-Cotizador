services:
  app:
    # Imagen publicada por el CI en cada push. El tag sigue a la rama: `main` es
    # lo que está liberado. (Ojo: `master` es una rama vieja que quedó atrás; si
    # el compose apunta ahí, el servidor se queda en esa versión para siempre.)
    # Para fijar una versión puntual: IMAGE_TAG=sha-abc1234 en el .env.
    image: ghcr.io/pel-matiasvaldivia/lgm-cotizador:${IMAGE_TAG:-main}
    container_name: logmetal_app
    restart: unless-stopped
    ports:
      - "3300:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      # Credenciales como variables separadas: soporta contraseñas con
      # caracteres especiales (@, /, #, :) que romperían una DATABASE_URL.
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=lgm
      - PGPASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      - PGDATABASE=cotizador
      # Servís por HTTP: la cookie de sesión NO debe ser Secure (si no, el
      # navegador la descarta y no persiste el login). Poner true al usar HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Multi-tenant: la identidad de cada empresa vive en la base y se resuelve
      # por dominio. BRAND sólo aporta los valores iniciales del primer arranque
      # (config/brands/<BRAND>.json); el resto de los BRAND_* viajan en .env.
      - BRAND=${BRAND:-logmetal}
    volumes:
      # Logos e imágenes del tenant sin rebuildear la imagen: dejá los archivos
      # en ./brand y referencialos como /brand/mi-logo.svg en la config.
      - ./brand:/app/public/brand:ro
      # Config de marca completa fuera del repo (opcional): descomentar y
      # además definir BRAND_CONFIG_FILE=/app/config/tenant/marca.json en .env.
      # - ./marca.json:/app/config/tenant/marca.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: logmetal_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=lgm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      - POSTGRES_DB=cotizador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgm -d cotizador"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Backup diario: dump verificado en ./backups y copia fuera del servidor.
  # Ver scripts/backup.sh — sin BACKUP_REMOTO avisa en cada corrida que el
  # respaldo vive sólo en esta máquina.
  backup:
    image: postgres:16-alpine
    container_name: logmetal_backup
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGUSER=lgm
      - PGDATABASE=cotizador
      - PGPASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      - BACKUP_RETENCION_DIAS=${BACKUP_RETENCION_DIAS:-14}
      - BACKUP_CADA_SEGUNDOS=${BACKUP_CADA_SEGUNDOS:-86400}
      # Destino remoto en formato rclone (ej: b2:mi-bucket/cotizador). Las
      # credenciales van como RCLONE_CONFIG_* en el .env.
      - BACKUP_REMOTO=${BACKUP_REMOTO:-}
    env_file:
      - .env
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
